claude_usage personal {
    name = 'Personal'
    path = '~/.claude'
    cache_timeout = 300
}

claude_usage company {
    name = 'Company'
    path = '~/.claude-company'
    cache_timeout = 600
    format = '{name} {hourly_percent}%{hourly_chart} {weekly_percent}%{weekly_chart}{weekly_time_remain}'
    thresholds = {
        'hourly_percent': [(0, 'good'), (60, 'degraded'), (85, 'bad')],
        'weekly_percent': [(0, 'good'), (76, 'degraded'), (90, 'bad')],
    }
}

order += "claude_usage personal"
order += "claude_usage company"
