[build-system]
requires = ["uv_build>=0.11,<0.12"]
build-backend = "uv_build"

[project]
name = "py3status-claude-usage"
version = "0.1.0"
description = "py3status module showing Claude Code subscription usage"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Stepan Henek", email = "henes5am@gmail.com" }]
keywords = ["py3status", "i3", "i3status", "claude", "claude-code", "usage"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Desktop Environment :: Window Managers",
]
dependencies = ["requests"]

[project.urls]
Homepage = "https://github.com/shenek/i3status-claude"
Repository = "https://github.com/shenek/i3status-claude"
Issues = "https://github.com/shenek/i3status-claude/issues"
Changelog = "https://github.com/shenek/i3status-claude/blob/main/CHANGELOG.md"

[dependency-groups]
dev = ["pytest", "responses"]

[project.entry-points.py3status]
claude_usage = "py3status_claude_usage.claude_usage"

[tool.uv.build-backend]
module-name = "py3status_claude_usage"

[tool.pytest.ini_options]
testpaths = ["tests"]
